<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Portable Notes</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="app">
<aside class="rail"><div class="brand">P<span>Portable<br>Notes</span></div><button id="newBtn" title="New note (Ctrl+N)">＋</button><button id="allBtn" class="active" title="All notes">▤</button><button id="favBtn" title="Favorites">★</button><button id="trashBtn" title="Trash">⌫</button><div class="spacer"></div><button id="themeBtn" title="Theme">◐</button><a class="iconbtn" href="/api/export" title="Export backup">⇩</a></aside>
<aside class="sidebar"><div class="search"><span>⌕</span><input id="search" placeholder="Search notes, tags, folders…" autocomplete="off"><kbd>Ctrl K</kbd></div><div class="side-title"><strong id="listTitle">All Notes</strong><span id="count"></span></div><div id="notes" class="notes"></div></aside>
<main class="workspace"><header><input id="title" class="title" placeholder="Untitled"><div class="actions"><span id="saveState">Ready</span><button id="pinBtn" title="Pin">⌖</button><button id="favEditBtn" title="Favorite">☆</button><button id="previewBtn">Preview</button><button id="moreBtn" title="Move to trash">⋯</button></div></header>
<div class="meta"><input id="folder" placeholder="Folder"><input id="tags" placeholder="tags, comma, separated"><span id="updated"></span></div>
<section class="editor-wrap"><textarea id="editor" spellcheck="true" placeholder="Start writing in Markdown…"></textarea><article id="preview" class="markdown hidden"></article></section>
<footer><span id="words">0 words</span><span>Markdown</span><span>Local • Private • Autosaved</span></footer></main>
<aside id="rightbar" class="rightbar"><h3>Knowledge links</h3><div class="card"><b>Outgoing links</b><div id="outgoing"></div></div><div class="card"><b>Backlinks</b><div id="backlinks"></div></div><div class="card tips"><b>Quick tips</b><p><kbd>Ctrl S</kbd> Save</p><p><kbd>Ctrl N</kbd> New note</p><p><kbd>[[Title]]</kbd> Link a note</p><p><kbd>#tag</kbd> Inline tag</p></div></aside>
</div><div id="toast"></div><script src="/static/app.js"></script></body></html>
